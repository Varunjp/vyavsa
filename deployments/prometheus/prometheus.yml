global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "vyavsa-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8080"]
        labels:
          environment: "docker-compose"
          service: "vyavsa-bill-book-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          environment: "docker-compose"
          service: "node-exporter"

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          environment: "docker-compose"
          service: "cadvisor"

