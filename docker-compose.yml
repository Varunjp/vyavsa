services:
  # ----------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vyavsa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-billbook}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-billbook}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vyavsa_network

  # ----------------------------------------------------
  # Redis In-Memory Cache & State
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vyavsa_redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-server --requirepass "$${REDIS_PASSWORD}"
        else
          redis-server
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c '
          if [ -n "$${REDIS_PASSWORD}" ]; then
            redis-cli -a "$${REDIS_PASSWORD}" ping
          else
            redis-cli ping
          fi
        '
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vyavsa_network

  # ----------------------------------------------------
  # Vyavsa API Application Service
  # ----------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vyavsa_api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-vyavsa-bill-book-api}
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8080"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-billbook}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      DATABASE_AUTO_MIGRATE: ${DATABASE_AUTO_MIGRATE:-true}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-25}
      DATABASE_MIN_CONNS: ${DATABASE_MIN_CONNS:-5}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
      PROMETHEUS_PATH: ${PROMETHEUS_PATH:-/metrics}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@vyavsa.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Vyavsa Support}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - vyavsa_network

  # ----------------------------------------------------
  # Prometheus Time-Series Metrics
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: vyavsa_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - vyavsa_network

  # ----------------------------------------------------
  # Grafana Observability Dashboards
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: vyavsa_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - vyavsa_network
  # ----------------------------------------------------
  # Node Exporter (Host System & Hardware Metrics)
  # ----------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: vyavsa_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - vyavsa_network

  # ----------------------------------------------------
  # cAdvisor (Container Resource & Performance Metrics)
  # ----------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: vyavsa_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - vyavsa_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  vyavsa_network:
    driver: bridge
