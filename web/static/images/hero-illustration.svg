<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Outer Window Frame -->
  <rect x="10" y="10" width="780" height="480" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Window Header Bar -->
  <rect x="10" y="10" width="780" height="46" rx="16" fill="#F8FAFC"/>
  <path d="M10 56h780" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="36" cy="33" r="5" fill="#EF4444"/>
  <circle cx="54" cy="33" r="5" fill="#F59E0B"/>
  <circle cx="72" cy="33" r="5" fill="#10B981"/>
  
  <!-- Search/URL Bar Mock -->
  <rect x="220" y="22" width="360" height="22" rx="6" fill="#EDF2F7"/>
  <text x="330" y="37" font-family="-apple-system, sans-serif" font-size="11" fill="#718096" font-weight="500">app.vyavsa.com/dashboard</text>
  
  <!-- Top Stat Cards -->
  <!-- Card 1: Cash & Bank Balance -->
  <g transform="translate(36, 76)">
    <rect width="220" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="28" font-family="-apple-system, sans-serif" font-size="12" fill="#64748B" font-weight="600">TOTAL CASH &amp; BANK</text>
    <text x="16" y="60" font-family="-apple-system, sans-serif" font-size="24" fill="#0F172A" font-weight="800">₹ 1,48,250</text>
    <rect x="16" y="70" width="70" height="16" rx="8" fill="#ECFDF5"/>
    <text x="24" y="82" font-family="-apple-system, sans-serif" font-size="10" fill="#059669" font-weight="700">+14.2%% this mo</text>
  </g>
  
  <!-- Card 2: Customer Dues (Receivables) -->
  <g transform="translate(290, 76)">
    <rect width="220" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="28" font-family="-apple-system, sans-serif" font-size="12" fill="#64748B" font-weight="600">CUSTOMER DUES (RECEIVABLE)</text>
    <text x="16" y="60" font-family="-apple-system, sans-serif" font-size="24" fill="#2563EB" font-weight="800">₹ 34,800</text>
    <rect x="16" y="70" width="84" height="16" rx="8" fill="#EFF6FF"/>
    <text x="24" y="82" font-family="-apple-system, sans-serif" font-size="10" fill="#2563EB" font-weight="700">8 pending invoices</text>
  </g>

  <!-- Card 3: Payables & Expenses -->
  <g transform="translate(544, 76)">
    <rect width="220" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="28" font-family="-apple-system, sans-serif" font-size="12" fill="#64748B" font-weight="600">MONTHLY EXPENSES &amp; SALARY</text>
    <text x="16" y="60" font-family="-apple-system, sans-serif" font-size="24" fill="#0F172A" font-weight="800">₹ 21,500</text>
    <rect x="16" y="70" width="82" height="16" rx="8" fill="#F1F5F9"/>
    <text x="24" y="82" font-family="-apple-system, sans-serif" font-size="10" fill="#475569" font-weight="700">4 active staff paid</text>
  </g>
  
  <!-- Chart & Ledger Split View -->
  <!-- Left: Revenue / Sales Trend -->
  <g transform="translate(36, 192)">
    <rect width="434" height="268" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="14" fill="#0F172A" font-weight="700">Revenue &amp; Transactions</text>
    <text x="20" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B">Last 7 days performance</text>
    
    <!-- Grid Lines -->
    <path d="M40 90h360M40 135h360M40 180h360M40 225h360" stroke="#F1F5F9" stroke-width="1"/>
    
    <!-- Trend Area Fill -->
    <path d="M40 220 Q 90 190, 140 200 T 240 140 T 320 110 T 400 80 L 400 230 L 40 230 Z" fill="url(#trendGradient)" opacity="0.25"/>
    
    <!-- Trend Line -->
    <path d="M40 220 Q 90 190, 140 200 T 240 140 T 320 110 T 400 80" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Data Points -->
    <circle cx="140" cy="200" r="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="240" cy="140" r="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="320" cy="110" r="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="400" cy="80" r="5" fill="#2563EB"/>
    
    <!-- Days -->
    <text x="40" y="246" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Mon</text>
    <text x="100" y="246" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Tue</text>
    <text x="160" y="246" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Wed</text>
    <text x="220" y="246" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Thu</text>
    <text x="280" y="246" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Fri</text>
    <text x="340" y="246" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Sat</text>
    <text x="390" y="246" font-family="-apple-system, sans-serif" font-size="10" fill="#2563EB" font-weight="700">Sun</text>
  </g>
  
  <!-- Right: Recent Bill Book Entries -->
  <g transform="translate(490, 192)">
    <rect width="274" height="268" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="18" y="32" font-family="-apple-system, sans-serif" font-size="14" fill="#0F172A" font-weight="700">Recent Bill Book Entries</text>
    <text x="18" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B">Live ledger updates</text>
    
    <!-- Entry 1 -->
    <g transform="translate(18, 66)">
      <rect width="238" height="42" rx="6" fill="#F8FAFC"/>
      <circle cx="20" cy="21" r="10" fill="#ECFDF5"/>
      <path d="M17 21l2 2 4-4" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
      <text x="38" y="18" font-family="-apple-system, sans-serif" font-size="11" fill="#0F172A" font-weight="600">Sharma Kirana Store</text>
      <text x="38" y="30" font-family="-apple-system, sans-serif" font-size="9" fill="#64748B">Sale #1042 • Cash</text>
      <text x="226" y="24" font-family="-apple-system, sans-serif" font-size="12" fill="#059669" font-weight="700" text-anchor="end">+₹ 4,200</text>
    </g>

    <!-- Entry 2 -->
    <g transform="translate(18, 116)">
      <rect width="238" height="42" rx="6" fill="#F8FAFC"/>
      <circle cx="20" cy="21" r="10" fill="#EFF6FF"/>
      <path d="M17 21l2 2 4-4" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
      <text x="38" y="18" font-family="-apple-system, sans-serif" font-size="11" fill="#0F172A" font-weight="600">Gupta Traders</text>
      <text x="38" y="30" font-family="-apple-system, sans-serif" font-size="9" fill="#64748B">Due Payment Received</text>
      <text x="226" y="24" font-family="-apple-system, sans-serif" font-size="12" fill="#2563EB" font-weight="700" text-anchor="end">+₹ 12,500</text>
    </g>

    <!-- Entry 3 -->
    <g transform="translate(18, 166)">
      <rect width="238" height="42" rx="6" fill="#F8FAFC"/>
      <circle cx="20" cy="21" r="10" fill="#FEF2F2"/>
      <path d="M16 21h8" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>
      <text x="38" y="18" font-family="-apple-system, sans-serif" font-size="11" fill="#0F172A" font-weight="600">Ramesh Kumar (Staff)</text>
      <text x="38" y="30" font-family="-apple-system, sans-serif" font-size="9" fill="#64748B">Monthly Salary Disbursed</text>
      <text x="226" y="24" font-family="-apple-system, sans-serif" font-size="12" fill="#DC2626" font-weight="700" text-anchor="end">-₹ 8,500</text>
    </g>

    <!-- Entry 4 -->
    <g transform="translate(18, 216)">
      <rect width="238" height="38" rx="6" fill="#F8FAFC"/>
      <circle cx="20" cy="19" r="10" fill="#ECFDF5"/>
      <path d="M17 19l2 2 4-4" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
      <text x="38" y="17" font-family="-apple-system, sans-serif" font-size="11" fill="#0F172A" font-weight="600">Balaji Electricals</text>
      <text x="38" y="29" font-family="-apple-system, sans-serif" font-size="9" fill="#64748B">Invoice #891 • UPI</text>
      <text x="226" y="22" font-family="-apple-system, sans-serif" font-size="12" fill="#059669" font-weight="700" text-anchor="end">+₹ 1,850</text>
    </g>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="trendGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
